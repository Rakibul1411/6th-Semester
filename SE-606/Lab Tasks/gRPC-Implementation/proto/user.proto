syntax = "proto3";

package user;

// User message definition
message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string password = 4;
  string phone = 5;
  string role = 6;
  string created_at = 7;
  string updated_at = 8;
}

// Request messages
message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string phone = 4;
  string role = 5;
}

message GetUserRequest {
  string id = 1;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string role = 5;
}

message DeleteUserRequest {
  string id = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
}

// Response messages
message UserResponse {
  bool success = 1;
  string message = 2;
  User user = 3;
}

message ListUsersResponse {
  bool success = 1;
  string message = 2;
  repeated User users = 3;
  int32 total = 4;
  int32 page = 5;
  int32 limit = 6;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

// Queue state message for failure handling
message QueueState {
  string operation_id = 1;
  string operation_type = 2;
  string user_id = 3;
  string data = 4;
  string status = 5;
  string error_message = 6;
  string timestamp = 7;
}

// User service definition
service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}
